server {
    listen 8080;
    root /usr/share/nginx/html;

    # The app is built with base path /mishkefet-app/ upstream.
    location = / { return 302 /mishkefet-app/; }

    location /mishkefet-app/ {
        include /etc/nginx/mime.types;
        types { text/javascript mjs; application/wasm wasm; }
        try_files $uri $uri/ /mishkefet-app/index.html;
    }

    # Service worker must never be stale, or app updates won't land.
    location = /mishkefet-app/sw.js { add_header Cache-Control "no-cache"; }
}
