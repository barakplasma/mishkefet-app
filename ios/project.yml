name: Mishkefet
options:
  bundleIdPrefix: com.itayinbar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: he

packages:
  # The recognition engine; another part of the repo, consumed by path.
  MishkefetCore:
    path: MishkefetCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal team "Itay Inbar". Do not change to another team.
    DEVELOPMENT_TEAM: "65MGR94YVU"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

targets:
  Mishkefet:
    type: application
    platform: iOS
    sources:
      - path: Mishkefet
        excludes:
          - "Model"
          - "Model/**"
          - "**/*.md"
          - "Resources/Fonts/**/OFL.txt"
      - path: Shared
      # Model files are fetched (pinned + checksummed) by the pre-build script
      # below and shipped flat under Model/ in the bundle. Gitignored.
      - path: Mishkefet/Model
        type: folder
        buildPhase: resources
        optional: true
      # The training word pool, shared with the web app.
      - path: ../spec/train-words.json
        buildPhase: resources
    dependencies:
      - package: MishkefetCore
        product: MishkefetCore
    preBuildScripts:
      - name: Fetch Mishkefet-v1 model
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../tools/model/fetch-model.sh
        outputFiles:
          - $(SRCROOT)/Mishkefet/Model/backbone.fp16.onnx
          - $(SRCROOT)/Mishkefet/Model/head.bin
          - $(SRCROOT)/Mishkefet/Model/charlm.bin
          - $(SRCROOT)/Mishkefet/Model/words.bin
          - $(SRCROOT)/Mishkefet/Model/charset.json
        script: |
          set -euo pipefail
          "$SRCROOT/../tools/model/fetch-model.sh" "$SRCROOT/Mishkefet/Model"
          touch "$SRCROOT/Mishkefet/Model/"*
    postBuildScripts:
      # onnxruntime.framework's Info.plist says MinimumOSVersion 15.1 while its binary is built for
      # a newer iOS; App Store processing rejects that mismatch (ITMS-90208). Make the plist agree
      # with the binary, then re-sign the framework.
      - name: Fix onnxruntime.framework MinimumOSVersion
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          fw="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/onnxruntime.framework"
          [ -d "$fw" ] || exit 0
          minos="$(xcrun vtool -show-build "$fw/onnxruntime" | awk '/minos/ {print $2; exit}')"
          [ -n "$minos" ] || { echo "error: could not read minos of onnxruntime"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $minos" "$fw/Info.plist"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none --preserve-metadata=identifier,flags "$fw"
          fi
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Mishkefet
        PRODUCT_BUNDLE_IDENTIFIER: com.itayinbar.mishkefet
        INFOPLIST_FILE: Mishkefet/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: Mishkefet/Info.plist
      properties:
        CFBundleDisplayName: משקפת
        CFBundleDevelopmentRegion: he
        # Hebrew UI; the English table only localizes the camera permission prompt.
        CFBundleLocalizations: [he, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # On-device only: no network calls, no encryption beyond the OS.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "משקפת מצלמת דפים כדי לקרוא כתב יד. התמונות והקריאות נשארות במכשיר בלבד."
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts:
          - Karantina-Regular.ttf
          - Karantina-Bold.ttf
          - Rubik-Light.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
          - Rubik-Bold.ttf
          - AmaticSC-Bold.ttf

  MishkefetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MishkefetTests
    dependencies:
      - target: Mishkefet
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.itayinbar.mishkefet.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mishkefet.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mishkefet
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Mishkefet:
    build:
      targets:
        Mishkefet: all
        MishkefetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MishkefetTests
    archive:
      config: Release
